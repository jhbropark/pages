name: namecode daily (APOD → artwork → publish)

# Runs on GitHub's runners (open internet), so it reaches api.nasa.gov,
# api.krea.ai and graph.facebook.com without any container egress changes.
#
# SEPARATE from the queue-based pipeline (generate-content.yml /
# instagram-schedule.yml / linkedin-schedule.yml). That system serves a
# DIFFERENT brand/account via INSTAGRAM_* secrets and queue/queue.json.
# This one is namecode (@namecode_original) only:
#   - its own secrets: IG_USER_ID / IG_ACCESS_TOKEN  (do NOT reuse INSTAGRAM_*)
#   - its own paths:   namecode_grid/daily/           (never touches queue/, images/)
# Offset cron + rebase-before-push keep it from racing the hourly uploaders.

on:
  schedule:
    - cron: "15 13 * * *"     # 13:15 UTC daily — off the top of the hour so it
                              # doesn't race the hourly INSTAGRAM/LinkedIn pushers.
  workflow_dispatch:          # manual "Run workflow" button
    inputs:
      date:
        description: "APOD date (YYYY-MM-DD), blank = today"
        required: false
      publish:
        description: "Publish to Instagram? (true/false)"
        required: false
        default: "false"
      fb_only:
        description: "Facebook only: skip generation, cross-post an already-committed day (true/false)"
        required: false
        default: "false"
      test_only:
        description: "Run validation only; do not generate or publish (true/false)"
        required: false
        default: "false"

permissions:
  contents: write             # to commit the daily image

concurrency:
  group: namecode-daily
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    # the fb-only dispatch below replaces this job entirely for that run
    if: ${{ github.event.inputs.fb_only != 'true' && github.event.inputs.test_only != 'true' }}
    # job-level env so the optional publish step's `if:` can read the token
    # (secrets context is not allowed directly in `if:` expressions)
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      REQUESTED_DATE: ${{ github.event.inputs.date }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install --disable-pip-version-check --no-input requests Pillow

      - name: Fetch label font (JetBrains Mono)
        run: |
          set -euo pipefail
          mkdir -p /tmp/fnt
          curl --fail --retry 3 --retry-delay 2 --connect-timeout 10 -sSL \
            -o /tmp/fnt/JetBrainsMono.ttf \
            https://github.com/JetBrains/JetBrainsMono/raw/master/fonts/ttf/JetBrainsMono-Regular.ttf
          test -s /tmp/fnt/JetBrainsMono.ttf

      - name: Generate today's artwork from APOD
        id: gen
        working-directory: namecode_grid
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          KREA_API_KEY: ${{ secrets.KREA_API_KEY }}
          NAMECODE_FONT: /tmp/fnt/JetBrainsMono.ttf
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_DATE" && ! "$REQUESTED_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::date must be YYYY-MM-DD"
            exit 1
          fi
          DATE_ARG=()
          if [ -n "$REQUESTED_DATE" ]; then DATE_ARG=(--date "$REQUESTED_DATE"); fi
          mkdir -p daily
          DATE=$(date -u +%F)
          if [ -n "$REQUESTED_DATE" ]; then DATE="$REQUESTED_DATE"; fi
          python apod_namecode.py "${DATE_ARG[@]}" \
            --out "daily/namecode_apod_${DATE}.png" \
            --reel-out "daily/namecode_apod_${DATE}_9x16.png" \
            --brief-out "daily/brief_${DATE}.json" \
            --caption-out "daily/caption_${DATE}.txt"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "image=namecode_grid/daily/namecode_apod_${DATE}.png" >> "$GITHUB_OUTPUT"

      - name: Build searchable namecode archive
        run: node namecode_grid/build_namecode_archive.mjs --repo-root . --out ./namecode

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: namecode-apod-${{ steps.gen.outputs.date }}
          path: namecode_grid/daily/*${{ steps.gen.outputs.date }}*

      - name: Commit daily image
        run: |
          git config user.name "namecode-bot"
          git config user.email "bot@namecode.kr"
          git add namecode_grid/daily/ namecode/
          git commit -m "daily: APOD artwork ${{ steps.gen.outputs.date }}" || echo "nothing to commit"
          # Rebase-before-push so we don't lose to concurrent uploaders.
          PUSHED=false
          for i in 1 2 3 4 5; do
            if ! git pull --rebase --autostash origin "${{ github.ref_name }}"; then
              git rebase --abort || true
              echo "rebase retry $i"
              sleep 5
              continue
            fi
            if git push; then
              PUSHED=true
              break
            fi
            echo "push retry $i"
            sleep 5
          done
          if [ "$PUSHED" != true ]; then
            echo "::error::failed to push after 5 attempts"
            exit 1
          fi

      - name: Publish feed image to Instagram (optional)
        id: pub
        # only when a token is present AND publish=true (manual) or scheduled
        if: ${{ env.IG_ACCESS_TOKEN != '' && (github.event_name == 'schedule' || github.event.inputs.publish == 'true') }}
        working-directory: namecode_grid
        run: |
          set -o pipefail
          RAW="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/namecode_grid/daily/namecode_apod_${{ steps.gen.outputs.date }}.png"
          echo "Hosting image at: $RAW"
          python ig_publish.py --image-url "$RAW" \
            --caption-file "daily/caption_${{ steps.gen.outputs.date }}.txt" | tee /tmp/pub.txt
          echo "permalink=$(sed -n 's/^permalink: //p' /tmp/pub.txt)" >> "$GITHUB_OUTPUT"

      - name: Publish feed image to Facebook (optional)
        id: fbpub
        # cross-post the same artwork to the Facebook Page when its token is set.
        # continue-on-error: a dead FB token must not skip the FB reel step or
        # mark the whole run failed — Telegram reports the per-channel outcome.
        continue-on-error: true
        if: ${{ env.FB_PAGE_TOKEN != '' && (github.event_name == 'schedule' || github.event.inputs.publish == 'true') }}
        working-directory: namecode_grid
        run: |
          set -o pipefail
          RAW="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/namecode_grid/daily/namecode_apod_${{ steps.gen.outputs.date }}.png"
          echo "Hosting image at: $RAW"
          python fb_publish.py --image-url "$RAW" \
            --caption-file "daily/caption_${{ steps.gen.outputs.date }}_facebook.txt" | tee /tmp/fbpub.txt
          echo "permalink=$(sed -n 's/^permalink: //p' /tmp/fbpub.txt)" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram (status)
        if: ${{ always() && env.TELEGRAM_BOT_TOKEN != '' }}
        env:
          BUTTON_URL: ${{ steps.pub.outputs.permalink }}
          BUTTON_TEXT: "📷 View on Instagram"
          BUTTON2_URL: ${{ steps.fbpub.outputs.permalink }}
          BUTTON2_TEXT: "📘 View on Facebook"
        run: |
          DATE="${{ steps.gen.outputs.date }}"
          GEN="${{ steps.gen.outcome }}"
          PUB="${{ steps.pub.outcome }}"
          FBPUB="${{ steps.fbpub.outcome }}"
          LABEL=$(python -c "import json;print(json.load(open('namecode_grid/daily/brief_'+'$DATE'+'.json'))['label'])" 2>/dev/null || echo "")
          if [ "$GEN" != "success" ]; then
            MSG="🛰 namecode daily ${DATE:-?}
          ❌ generation FAILED — check the run logs."
          else
            MSG="🛰 namecode daily ${DATE}
          ✅ generated: ${LABEL:-?}
          IG feed: ${PUB} · reel: delegated
          FB feed: ${FBPUB} · reel: delegated"
          fi
          MESSAGE="$MSG" python namecode_grid/notify_telegram.py


  validate:
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test_only == 'true' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install validation deps
        run: python -m pip install --disable-pip-version-check --no-input requests Pillow

      - name: Compile namecode scripts
        run: |
          python -m py_compile \
            namecode_grid/apod_namecode.py \
            namecode_grid/krea.py \
            namecode_grid/krea_reel.py \
            namecode_grid/ig_publish.py \
            namecode_grid/fb_publish.py \
            namecode_grid/notify_telegram.py

      - name: Test namecode captions and archive without publishing
        run: |
          python -m unittest discover -s namecode_grid -p test_apod_namecode.py -v
          node --check namecode_grid/build_namecode_archive.mjs
          node namecode_grid/build_namecode_archive.mjs --repo-root . --out "$RUNNER_TEMP/namecode-archive-check"

      - name: Run APOD dry-run
        working-directory: namecode_grid
        run: |
          set -euo pipefail
          TMP_DIR=$(mktemp -d)
          python apod_namecode.py \
            --subject "Validation subject" \
            --name VALIDATION \
            --date 2099-01-01 \
            --dry-run \
            --brief-out "$TMP_DIR/brief.json" \
            --caption-out "$TMP_DIR/caption.txt"
          BRIEF_PATH="$TMP_DIR/brief.json" python -c \
            'import json, os; d=json.load(open(os.environ["BRIEF_PATH"])); assert d["work_name"] == "VALIDATION"; assert d["date"] == "2099-01-01"'
          test -s "$TMP_DIR/caption.txt"

  # Facebook-only cross-post of a day whose artwork is already committed.
  #
  # The daily job generates and publishes in one pass, so a Krea outage upstream
  # (a 500 on /generate/image, or a 402 on credit) loses the Facebook post for
  # that day even though the artwork is sitting in namecode_grid/daily/. This
  # path re-posts an existing day to the Page alone — no regeneration, and no
  # Instagram call, so it never duplicates a feed post that already went out.
  fb-only:
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.fb_only == 'true' && github.event.inputs.test_only != 'true' }}
    env:
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      REQUESTED_DATE: ${{ github.event.inputs.date }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Publish feed image to Facebook
        id: fbpub
        continue-on-error: true
        working-directory: namecode_grid
        run: |
          set -o pipefail
          pip install requests -q
          DATE="$REQUESTED_DATE"
          if [ -z "$DATE" ]; then DATE=$(date -u +%F); fi
          if [[ ! "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::date must be YYYY-MM-DD"
            exit 1
          fi
          IMG="daily/namecode_apod_${DATE}.png"
          if [ ! -f "$IMG" ]; then
            echo "::error::$IMG is not committed — pick a date that has artwork."
            exit 1
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          RAW="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/namecode_grid/$IMG"
          echo "Hosting image at: $RAW"
          python fb_publish.py --image-url "$RAW" \
            --caption-file "daily/caption_${DATE}.txt" | tee /tmp/fbpub.txt
          echo "permalink=$(sed -n 's/^permalink: //p' /tmp/fbpub.txt)" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram (status)
        if: ${{ always() && env.TELEGRAM_BOT_TOKEN != '' }}
        env:
          BUTTON_URL: ${{ steps.fbpub.outputs.permalink }}
          BUTTON_TEXT: "📘 View on Facebook"
        run: |
          pip install requests -q
          MSG="🛰 namecode — Facebook-only cross-post ${{ steps.fbpub.outputs.date }}
          FB feed: ${{ steps.fbpub.outcome }}"
          MESSAGE="$MSG" python namecode_grid/notify_telegram.py
