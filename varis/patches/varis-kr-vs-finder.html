<!--
  ============================================================================
  varis.kr 30초 진단기 (#vs-finder) 재정비본 — 카탈로그 7개 정합
  ============================================================================

  대상   : Vercel 프로젝트 varis-academy 의 index.html
  기준   : varis.kr 2026-08-23 배포본

  ⚠ 이 파일은 참고용입니다. 실제 수정은 원본 소스에 이미 적용돼 있습니다.

    원본 : jhbropark/academy-varis  (varis 전 사이트 모노레포)
    경로 : varis-academy/index.html
    PR   : https://github.com/jhbropark/academy-varis/pull/4

  처음에는 varis.kr 소스가 어디에도 없는 줄 알고 이 교체본을 만들었으나,
  academy-varis 레포에 처음부터 있었습니다. 없었던 것은 소스가 아니라
  Vercel 프로젝트(varis-academy)와 레포의 연결뿐입니다.

  그래도 이 파일을 남겨두는 이유는 두 가지입니다.
    · 아래 "고친 것 / 남겨둔 것" 에 판단 근거와 되돌리는 방법이 정리돼 있음
    · 같은 디렉터리의 verify-finder.js 로 가중치를 다시 검증할 수 있음
  코드를 고칠 때는 이 파일이 아니라 위 원본을 고치세요. 둘이 어긋나면 원본이 맞습니다.

  ── 적용 방법 ───────────────────────────────────────────────────────────────
  index.html 에서 아래 3개 블록을 이 파일의 같은 이름 블록으로 통째로 교체합니다.

    1. <style  id="vs-finder-css"> … </style>     ← 끝부분에 규칙 3개만 추가됨
    2. <section id="vs-finder">    … </section>   ← 진행바 3→4, 폴백 슬롯 추가
    3. <script id="vs-finder-js">  … </script>    ← 전면 교체

  다른 섹션(#vs-catalog, #works, 푸터 등)은 손대지 않습니다.

  ── 고친 것 ─────────────────────────────────────────────────────────────────
  A. pro CTA 깨짐 해결
     기존 pro.url 이 'https://varis.kr/#apply' 였으나 varis.kr 에 #apply 앵커가
     없어, 가장 비싼 코호트를 추천받은 사람이 눌러도 아무 데도 가지 않았습니다.
     → 'https://pro.varis.kr/' 로 교체.

  B. 카탈로그 정합 (5개 → 카탈로그 7개 반영)
     기존 진단기는 ai/coach/pro/elite/prem 5개뿐이라 VOD·워크숍·무료진입이
     어떤 응답 조합으로도 추천되지 않았습니다.
     → 추천 대상 6개(vod/ai/workshop/pro/elite/prem) + start 는 상시 폴백.

     start(무료 뉴스레터)를 추천 결과에서 뺀 이유: 진단을 끝까지 마친 사람에게
     "뉴스레터를 구독하세요"는 결과로서 약합니다. 대신 모든 결과 하단에 항상
     노출되는 폴백 CTA로 넣어, 결정이 어려운 사람이 언제든 잡히도록 했습니다.
     (추천 대상으로 올리려면 COURSES 에 start 를 넣고 가중치만 주면 됩니다.)

     coach(houdini 온라인 코칭, 1회 15만)는 카탈로그에 없어 제외했습니다.
     되살리려면 COURSES 에 아래를 추가하고 Q1c·Q3a 에 coach:2 를 주면 됩니다.
       coach:{tier:'단회 · 코칭', name:'houdini 온라인 코칭',
              why:'이미 작업하시는 분께. 작업물을 화상으로 진단·피드백받는 단발성 코칭.',
              meta:['형태 · 60~90분 화상','가격 · 1회 15만 / 4회 50만'],
              url:'https://houdini.varis.kr/#options', label:'코칭 옵션 보기'}

  C. ai 과정 설명 불일치 해결
     기존: 'VARIS AI · AI 도구 30개 8주'  → 실제 카탈로그는 4주 코호트.
     → 'VARIS AI — AI 영상 도구 30개' / '온라인 · 무료 체험 가능' 으로 수정.

  D. Q4(학습 방식) 추가 — 3문항 → 4문항
     기존 3문항(목표/수준/예산)에는 온라인·오프라인을 가르는 축이 없어서
     workshop(상암 8주 오프라인)이 어떤 조합으로도 1위가 될 수 없었습니다.
     → Q4 로 자기주도 / 코호트·화상 / 오프라인을 물어 workshop 을 도달 가능하게.
     진행바도 3칸 → 4칸으로 맞췄습니다.

  E. 가격·표기를 라이브 카탈로그와 1:1 로 맞춤
     elite 월 33만(기존 문서의 35만은 낡은 값), pro 월 246,700원 × 6 (총 148만).

  F. withUtm() 이 프래그먼트 뒤에 쿼리를 붙이던 버그 수정
     기존: https://houdini.varis.kr/#options?utm_source=...
     ?utm_ 이 해시의 일부로 먹혀 #options 앵커와 UTM 추적이 동시에 깨져 있었다.
     elite·prem 두 과정에 해당 — 진단기에서 가장 비싼 경로다.
     쿼리를 해시 앞에 붙이도록 고쳤다.
     (81가지 전수 검사로는 안 잡혔고, headless 브라우저로 실제 클릭해서 발견했다.)

  ── 남겨둔 것 (별도 판단 필요) ──────────────────────────────────────────────
  · 워크숍 가격 표기가 자체 모순입니다: "8주 오프라인"인데 "월 8만 × 6 (48만)".
    8주면 2개월이라 6회차와 맞지 않습니다. 카탈로그(#vs-catalog)와 이 진단기가
    같은 문구를 쓰므로, 확정되면 양쪽을 함께 고쳐야 합니다.
    이 파일은 일단 카탈로그 표기를 그대로 따릅니다.
  · JSON-LD 주소는 부산진구인데 페이지 전면은 '서울 상암 DDMC'입니다.
    등록지/교육공간이 다른 것이면 정상이나, 검색엔진에는 부산 학원으로 잡힙니다.
  ============================================================================
-->

<section id="vs-finder" aria-labelledby="vsf-title">
  <div class="vsf-inner">
    <header class="vsf-head">
      <span class="vsf-kicker">COURSE FINDER · 30초 진단</span>
      <h2 id="vsf-title">나에게 맞는 <em>VARIS 과정</em> 찾기</h2>
      <p class="vsf-dek">네 가지만 고르면, 지금 상황에 맞는 과정을 추천해 드립니다.</p>
    </header>

    <div class="vsf-progress" aria-hidden="true">
      <span class="vsf-bar" data-step="0"></span>
      <span class="vsf-bar" data-step="1"></span>

<!-- ==========================================================================
     BLOCK 3 / 3 — <script id="vs-finder-js"> 전체 교체

<script id="vs-finder-js">
(function(){
  "use strict";
  var root = document.getElementById('vs-finder');
  if(!root) return;
  var stage = root.querySelector('.vsf-stage');
  var bars  = root.querySelectorAll('.vsf-bar');
  var backBtn = root.querySelector('.vsf-back');

  // ---- 추천 대상 과정 (varis.kr #vs-catalog 와 1:1 정합) ----
  var COURSES = {
    vod: {
      tier:'입문 · VOD', name:'AI 미디어아트, 첫 한 편',
      why:'완전 초보가 가장 가볍게 시작하는 길. 4주 자기주도로 15초 완성작 1편을 끝냅니다.',
      meta:['형태 · 온라인 자기주도 · 4주','가격 · 얼리버드 ₩39,000'],
      url:'https://vod.varis.kr/', label:'첫 한 편 VOD 보기'
    },
    ai: {
      tier:'도구 · AI 영상', name:'VARIS AI — AI 영상 도구 30개',
      why:'도구 선택부터 기획·생성·편집·납품까지, AI 영상 한 편을 완성하는 실무 과정입니다.',
      meta:['형태 · 온라인 · 무료 체험 가능','가격 · ₩149,000~'],
      url:'https://ai.varis.kr/', label:'VARIS AI 과정 보기'
    },
    workshop: {
      tier:'워크숍 · 오프라인', name:'미디어아트 실무 워크숍 (8주)',
      why:'상암에 직접 나와 손으로 익히는 과정. 작품 1편과 공간 목업, 포트폴리오 덱까지 만듭니다.',
      meta:['형태 · 상암 오프라인 · 8주','가격 · 월 8만 × 6 (48만)'],
      url:'https://workshop.varis.kr/', label:'워크숍 과정 보기'
    },
    pro: {
      tier:'코호트 · 전문가', name:'이머시브 미디어아트 & 테크 전문가 과정',
      why:'이직·포트폴리오가 목표라면. 6개월 4단계 커리큘럼으로 기초부터 실무까지.',
      meta:['형태 · 6개월 · 20명 · 상암 DDMC','가격 · 월 246,700원 × 6 (총 148만)'],
      url:'https://pro.varis.kr/', label:'전문가 과정 지원하기'
    },
    elite: {
      tier:'멘토링 · Elite', name:'houdini Elite Small Group',
      why:'작품을 끝까지 완성하고 싶은 분께. 최대 4명 소그룹으로 6개월 밀도 있게.',
      meta:['형태 · 최대 4명 · 6개월 · 상암+화상','가격 · 월 33만 × 6 (198~240만)'],
      url:'https://houdini.varis.kr/#options', label:'Elite 과정 보기'
    },
    prem: {
      tier:'1:1 · Premium', name:'houdini Premium 1:1 밀착 멘토링',
      why:'개인 목표에 맞춘 밀착 멘토링. 주간 1:1로 대표작을 완성합니다.',
      meta:['형태 · 6개월 · 1:1 밀착','가격 · 월 65만 × 6 (390~480만)'],
      url:'https://houdini.varis.kr/#options', label:'Premium 1:1 보기'
    }
  };

  // 추천 결과가 아니라, 모든 결과 하단에 상시 노출되는 폴백
  var FALLBACK = { name:'미디어아트, 무료로 시작하기', url:'https://start.varis.kr/', id:'start' };

  // ---- 질문 + 각 답의 가중치 ----
  var QUESTIONS = [
    { lab:'Q1 · 목표', title:'무엇을 위해 배우시나요?', opts:[
      { emo:'🌱', t:'취미로 입문',       s:'가볍게 시작하고 싶어요',   w:{vod:3,ai:2} },
      { emo:'💼', t:'이직 · 포트폴리오', s:'커리어 전환이 목표예요',   w:{pro:3,workshop:2,elite:2,ai:1} },
      { emo:'🚀', t:'실무자 스킬업',     s:'현업 실력을 끌어올려요',   w:{elite:3,prem:2,ai:2,workshop:1} }
    ]},
    { lab:'Q2 · 현재 수준', title:'지금 어느 단계인가요?', opts:[
      { emo:'🐣', t:'완전 초보',      s:'툴을 거의 처음 만져요',      w:{vod:3,ai:1} },
      { emo:'🔧', t:'툴 조금 다룸',   s:'혼자 만들어본 적 있어요',    w:{ai:3,workshop:2,pro:2,vod:1} },
      { emo:'🎬', t:'실무 경험 있음', s:'작업/프로젝트 경험이 있어요', w:{elite:3,prem:2,pro:1} }
    ]},
    { lab:'Q3 · 예산 · 시간', title:'투입할 수 있는 예산/시간은?', opts:[
      { emo:'🍃', t:'가볍게 (~15만)', s:'부담 없이 맛보기',        w:{vod:3,ai:2} },
      { emo:'📅', t:'6개월 집중',     s:'제대로 6개월 투자 가능',   w:{pro:3,elite:3,workshop:1} },
      { emo:'🎯', t:'1:1 밀착',       s:'개인 맞춤이 필요해요',     w:{prem:4,elite:1} }
    ]},
    { lab:'Q4 · 학습 방식', title:'어떤 방식이 편하신가요?', opts:[
      { emo:'💻', t:'온라인 자기주도',   s:'내 속도로 혼자 진행',      w:{vod:3,ai:3} },
      { emo:'🎥', t:'온라인 코호트·화상', s:'같이 가되 원격으로',      w:{pro:2,elite:2,ai:1,prem:1} },
      { emo:'🏫', t:'오프라인 · 상암',   s:'직접 나가서 배우고 싶어요', w:{workshop:4,pro:2,elite:1,prem:1} }
    ]}
  ];

  var TIE_PRIORITY = ['prem','elite','pro','workshop','ai','vod']; // 동점 시 상위과정 우선
  var answers = [];

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  function setProgress(step){
    var done = step >= QUESTIONS.length;
    bars.forEach(function(b,i){ b.classList.toggle('on', done || i <= step); });
  }

  function renderQuestion(step){
    var q = QUESTIONS[step];
    setProgress(step);
    backBtn.hidden = (step === 0);
    var html = '<div class="vsf-step vsf-q">'
      + '<span class="vsf-ql">'+esc(q.lab)+'</span>'
      + '<h3 class="vsf-qt">'+esc(q.title)+'</h3>'
      + '<div class="vsf-opts">';
    q.opts.forEach(function(o,i){
      html += '<button class="vsf-opt" type="button" data-i="'+i+'">'
        + '<span class="vsf-emo" aria-hidden="true">'+o.emo+'</span>'
        + '<span class="vsf-otxt"><span>'+esc(o.t)+'</span>'
        + '<span class="vsf-osub">'+esc(o.s)+'</span></span>'
        + '<span class="vsf-chev" aria-hidden="true">→</span></button>';
    });
    html += '</div></div>';
    stage.innerHTML = html;
    stage.querySelectorAll('.vsf-opt').forEach(function(btn){
      btn.addEventListener('click', function(){
        answers[step] = q.opts[+btn.dataset.i].w;
        if(step+1 < QUESTIONS.length){ renderQuestion(step+1); }
        else { renderResult(); }
      });
    });
    var first = stage.querySelector('.vsf-opt'); if(first) first.focus();
  }

  function score(){
    var s = {};
    Object.keys(COURSES).forEach(function(k){ s[k] = 0; });
    answers.forEach(function(w){ for(var k in w){ if(k in s) s[k] += w[k]; } });
    return s;
  }

  function rank(s){
    return Object.keys(COURSES).slice().sort(function(a,b){
      if(s[b] !== s[a]) return s[b] - s[a];
      return TIE_PRIORITY.indexOf(a) - TIE_PRIORITY.indexOf(b);
    });
  }

  function withUtm(url, contentId){
    // 프래그먼트(#options)가 있으면 쿼리를 그 '앞'에 붙여야 한다.
    // 뒤에 붙이면 ?utm_...이 해시의 일부가 되어 앵커와 추적이 둘 다 깨진다.
    var hash = '', i = url.indexOf('#');
    if(i > -1){ hash = url.slice(i); url = url.slice(0, i); }
    return url + (url.indexOf('?') > -1 ? '&' : '?')
      + 'utm_source=varis_hub&utm_medium=diagnostic&utm_campaign=course_finder'
      + '&utm_content=' + encodeURIComponent(contentId) + hash;
  }

  function renderResult(){
    setProgress(QUESTIONS.length);
    backBtn.hidden = true;
    var order = rank(score());
    try{ if(window.va) window.va('track','diagnostic_complete',{top:order[0]}); }catch(e){}
    var top = COURSES[order[0]], alt = COURSES[order[1]];
    var html = '<div class="vsf-result">'
      + '<div class="vsf-rlead">✦ 추천 과정</div>'
      + '<div class="vsf-rcard">'
        + '<div class="vsf-rtier">'+esc(top.tier)+'</div>'
        + '<div class="vsf-rname">'+esc(top.name)+'</div>'
        + '<p class="vsf-rwhy">'+esc(top.why)+'</p>'
        + '<div class="vsf-rmeta">'
          + top.meta.map(function(m){ return '<span>'+esc(m)+'</span>'; }).join('')
        + '</div>'
        + '<a class="vsf-cta" href="'+esc(withUtm(top.url, order[0]))+'">'
          + esc(top.label)+' <span aria-hidden="true">↗</span></a>'
      + '</div>'
      + '<div class="vsf-alt">'
        + '<span class="vsf-alab">함께 고려</span>'
        + '<span class="vsf-aname">'+esc(alt.name)+'</span>'
        + '<a href="'+esc(withUtm(alt.url, order[1]))+'">보기 →</a>'
      + '</div>'
      + '<p class="vsf-fallback">아직 정하기 어렵다면 '
        + '<a href="'+esc(withUtm(FALLBACK.url, FALLBACK.id))+'">'+esc(FALLBACK.name)+' →</a></p>'
      + '<button class="vsf-reset" type="button">↺ 다시 진단하기</button>'
      + '</div>';
    stage.innerHTML = html;
    stage.querySelector('.vsf-reset').addEventListener('click', reset);
    var cta = stage.querySelector('.vsf-cta'); if(cta) cta.focus();
  }

  function reset(){ answers = []; renderQuestion(0); }

  backBtn.addEventListener('click', function(){
    var back = Math.max(0, answers.length - 1);
    answers = answers.slice(0, back);
    renderQuestion(back);
  });

  renderQuestion(0);
})();
</script>
